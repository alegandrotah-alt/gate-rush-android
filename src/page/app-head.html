<script>
// home-screen web app: offline cache (skipped inside the Android app), and no pinch zoom on iOS
if('serviceWorker' in navigator&&!window.Capacitor&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
