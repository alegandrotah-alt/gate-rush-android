name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor and Pillow
        run: |
          npm install
          pip install pillow

      - name: Bundle fonts for offline play
        run: python3 tools/fetch_fonts.py

      - name: Generate and customise the Android project
        run: |
          npx cap add android
          npx cap sync android
          python3 tools/android_setup.py

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GateRush-${{ github.run_number }}.apk
          ls -la GateRush-*.apk

      - name: Publish to Releases (direct download link for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" GateRush-${{ github.run_number }}.apk \
            --title "Gate Rush build ${{ github.run_number }}" \
            --notes "Tap GateRush-${{ github.run_number }}.apk to download, then open it on your phone to install." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: gate-rush-apk
          path: GateRush-*.apk
          retention-days: 30
